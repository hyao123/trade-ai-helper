<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Outer glow -->
  <circle cx="60" cy="60" r="58" fill="url(#glow)"/>
  
  <!-- Main circle -->
  <circle cx="60" cy="60" r="52" fill="url(#bg)"/>
  
  <!-- Globe lines (trade/international) -->
  <ellipse cx="60" cy="60" rx="28" ry="28" stroke="white" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>
  <ellipse cx="60" cy="60" rx="14" ry="28" stroke="white" stroke-width="1.2" stroke-opacity="0.25" fill="none"/>
  <line x1="32" y1="60" x2="88" y2="60" stroke="white" stroke-width="1.2" stroke-opacity="0.25"/>
  <line x1="60" y1="32" x2="60" y2="88" stroke="white" stroke-width="1.2" stroke-opacity="0.25"/>
  
  <!-- AI sparkle/lightning bolt (center) -->
  <path d="M54 40 L48 62 H58 L52 82 L72 56 H60 L66 40 Z" 
        fill="white" fill-opacity="0.95"/>
  
  <!-- Small sparkles -->
  <circle cx="38" cy="42" r="2" fill="white" fill-opacity="0.6"/>
  <circle cx="82" cy="48" r="1.5" fill="white" fill-opacity="0.5"/>
  <circle cx="78" cy="76" r="2" fill="white" fill-opacity="0.4"/>
  <circle cx="40" cy="78" r="1.5" fill="white" fill-opacity="0.5"/>
</svg>
