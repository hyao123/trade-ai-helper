name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Ruff lint
        run: ruff check . --select E,F,I --ignore E501

      - name: Syntax check (all .py files)
        run: python -m compileall .

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # Auto-merge is intentionally label-gated.
  # Add an `automerge` label to low-risk PRs that may be squashed after CI passes.
  auto-merge:
    name: Auto-merge labeled PRs to master
    needs: lint-and-test
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'master' &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Enable auto-merge (squash)
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
