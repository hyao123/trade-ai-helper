name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff pytest

      - name: Ensure generated bytecode is not tracked
        shell: bash
        run: |
          tracked="$(git ls-files '*__pycache__*' '*.pyc')"
          if [ -n "$tracked" ]; then
            echo "Generated Python bytecode must not be tracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Ruff lint
        run: ruff check .

      - name: Syntax check (all .py files)
        run: python -m compileall .

      - name: Run tests
        run: pytest -q

  # Auto-merge is intentionally label-gated.
  # Add an `automerge` label to low-risk PRs that may be squashed after CI passes.
  auto-merge:
    name: Auto-merge labeled PRs to master
    needs: lint-and-test
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'master' &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Enable auto-merge (squash)
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
